<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="Olímpio — Fullstack Developer">
  <title>Olímpio — Fullstack Developer</title>
  <defs>
    
    <filter id="soft-light" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="blade-light" x="-200%" y="-50%" width="500%" height="200%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="textGlow-light" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="0" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="corona-light">
      <stop offset="0.42" stop-color="#a8720a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a8720a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="terminator-light" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0.45" stop-color="#f7edd9" stop-opacity="0"/>
      <stop offset="1" stop-color="#f7edd9" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="rule-light" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#8a3f12" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a8720a" stop-opacity="0"/>
    </linearGradient>
    <!-- O crawl desaparece nas duas pontas da faixa; corte reto denunciaria a
         máscara e mataria a ilusão de distância. -->
    <linearGradient id="crawlFade-light" gradientUnits="userSpaceOnUse"
                    x1="0" y1="84" x2="0" y2="300">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.86" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="crawlMask-light" maskUnits="userSpaceOnUse"
          x="0" y="84" width="1000" height="216">
      <rect x="0" y="84" width="1000" height="216"
            fill="url(#crawlFade-light)"/>
    </mask>
    <clipPath id="card-light">
      <rect x="0" y="0" width="1000" height="480" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-light)">
    <rect width="1000" height="480" fill="#f7edd9"/>
    
