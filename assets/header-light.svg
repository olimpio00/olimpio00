        </circle>
      </g>
      <g>
        <circle cx="918" cy="114" r="37.800000000000004" fill="url(#corona-light)" opacity="0.75"/>
        <circle cx="918" cy="114" r="18" fill="#a8720a" opacity="0.92">
          <animate attributeName="opacity" values="0.92;0.75;0.92" dur="6s"
                   begin="1.8s" repeatCount="indefinite"/>
        </circle>
      </g></g>

    
    <g>
      <rect x="44" y="430" width="13" height="30" rx="2.5" fill="#8a7355"/>
      <rect x="44" y="437" width="13" height="2.5" fill="#5c4b34"/>
      <rect x="44" y="443" width="13" height="2.5" fill="#5c4b34"/>
      <rect x="46" y="452" width="9" height="5" rx="1" fill="#5c4b34"/>

      <rect x="45.5" y="40" width="10" height="390" rx="5"
            fill="#93c5fd" opacity="0.85" filter="url(#blade-light)">
        <animate attributeName="y" from="430" to="40" dur="0.85s" fill="freeze"/>
        <animate attributeName="height" from="0" to="390" dur="0.85s" fill="freeze"/>
      </rect>

      <rect x="48.75" y="40" width="3.5" height="390" rx="1.75" fill="#1d4ed8">
        <animate attributeName="y" from="430" to="40" dur="0.85s" fill="freeze"/>
        <animate attributeName="height" from="0" to="390" dur="0.85s" fill="freeze"/>
      </rect>
    </g>

    <text x="78" y="60" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#1f6f8b" opacity="0">
      <animate attributeName="opacity" to="1" dur="1.2s" fill="freeze"/>
      Há muito tempo, num repositório muito, muito distante…
    </text>

    
    <g mask="url(#crawlMask-light)">
      <!-- Sem textGlow aqui de propósito: é um bloco alto que reescala a cada
           frame, e feGaussianBlur sob transform animado custa caro por nada —
           amarelo sobre quase-preto já tem contraste de sobra. -->
      <g transform="translate(500 130)">
        <animateTransform attributeName="transform" type="translate" additive="sum"
                          values="0 190; 0 -223.5"
                          dur="32s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" additive="sum"
                          values="1 1; 0.42 0.42"
                          dur="32s" repeatCount="indefinite"/>
        
      <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="19"
            font-weight="800" letter-spacing="6" fill="#9c6206">EPISÓDIO VII</text>
      <text x="0" y="50" text-anchor="middle" font-family="'Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="42"
            font-weight="800" letter-spacing="1" fill="#9c6206">O PORTFÓLIO</text>
      <text x="0" y="120" text-anchor="middle" font-family="'Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20.5"
            font-weight="600" fill="#9c6206">Olímpio é um desenvolvedor fullstack operando entre</text>
      <text x="0" y="149" text-anchor="middle" font-family="'Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20.5"
            font-weight="600" fill="#9c6206">o front e o back. Angular, React e React Native de</text>
      <text x="0" y="178" text-anchor="middle" font-family="'Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20.5"
            font-weight="600" fill="#9c6206">um lado; Node, Go e Python do outro.</text>
      <text x="0" y="233" text-anchor="middle" font-family="'Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20.5"
            font-weight="600" fill="#9c6206">Nos arquivos a seguir estão registrados nove</text>
      <text x="0" y="262" text-anchor="middle" font-family="'Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20.5"
            font-weight="600" fill="#9c6206">sistemas completos, cada um construído de ponta a</text>
      <text x="0" y="291" text-anchor="middle" font-family="'Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20.5"
            font-weight="600" fill="#9c6206">ponta: interface, API, banco e deploy.</text>
      <text x="0" y="346" text-anchor="middle" font-family="'Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20.5"
            font-weight="600" fill="#9c6206">Role para baixo. Os registros de missão aguardam…</text>
      </g>
    </g>

    <text x="76" y="372" font-family="'Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="70" font-weight="800"
          letter-spacing="-1.5" fill="#9c6206" opacity="0">
      <animate attributeName="opacity" to="1" dur="0.9s" begin="0.5s" fill="freeze"/>
      Olímpio
    </text>

    
