<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Estatísticas do GitHub de olimpio00">
  <title>olimpio00 — 11 projetos, 138 commits, 7 linguagens</title>
  <defs>
    
    <!-- Régua da base, comum aos dois assets: brasa viva na esquerda apagando
         para a direita. É o que amarra banner e console como um par. -->
    <linearGradient id="rule-light" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#b3261e" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#c2410c" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sky-light" gradientUnits="userSpaceOnUse"
                    cx="500" cy="0" r="780">
      <stop offset="0" stop-color="#f7dccc"/>
      <stop offset="0.55" stop-color="#f2e6dd"/>
      <stop offset="1" stop-color="#f2e6dd"/>
    </radialGradient>
    <radialGradient id="ember-light">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#8a1c16" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8a1c16" stop-opacity="0"/>
    </radialGradient>
    <!-- Puxa a base para a cor de fundo, para o nome e os chips ficarem
         legíveis sobre a lava. No tema claro isso clareia em vez de escurecer,
         e por isso a opacidade é menor: 0.97 apagaria a rocha por completo. -->
    <linearGradient id="scrim-light" gradientUnits="objectBoundingBox" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f2e6dd" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#f2e6dd" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#f2e6dd" stop-opacity="0"/>
    </linearGradient>
    <!-- Região generosa: a bbox do veio tem ~22px de altura e o bloom precisa
         de ~55px de folga (metade do traço + 3σ). Apertado, o brilho é cortado
         numa linha reta acima da lava. -->
    <filter id="heat-light" x="-8%" y="-500%" width="116%" height="1100%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blade-light" x="-200%" y="-50%" width="500%" height="200%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <!-- Halo colorido: o blur puro devolveria brilho branco, e o design pede
         texto claro com auréola vermelha. feFlood tinge a silhueta borrada. -->
    <filter id="textGlow-light" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0" result="b"/>
      <!-- 0.6, não 1: com o halo muito opaco encostado num texto branco o
           resultado satura e volta a parecer brilho branco, não vermelho. -->
      <feFlood flood-color="#c2410c" flood-opacity="0.6" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip-light">
      <rect x="0" y="0" width="1000" height="320" rx="18"/>
    </clipPath>
    <clipPath id="barClip-light">
      <rect x="64" y="208" width="872" height="12" rx="6">
        <animate attributeName="width" from="0" to="872" dur="1.1s" begin="0.35s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

